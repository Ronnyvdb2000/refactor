name: Backtest ML Europa - gematchte EUR-vergelijking
on:
  push:
    branches: [main]
    paths: ['analyses/backtest_europe_ml.py', 'requirements-europe-ml.txt', '.github/workflows/backtest_europe_ml.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matched-historical-ml-backtest
  cancel-in-progress: false
  queue: max
jobs:
  comparison:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKTEST_HORIZON: '10'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-paper.txt -r requirements-europe-ml.txt
      - name: Train Europese modellen op bekende historie en vergelijk EUR-portefeuilles
        id: backtest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m analyses.backtest_europe_ml
      - name: Meld de Europese ML-vergelijking via Telegram
        if: ${{ !cancelled() && (steps.backtest.outcome == 'success' || steps.backtest.outcome == 'failure') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m analyses.backtest_europe_ml_telegram
