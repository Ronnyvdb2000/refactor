name: "Feature Store: Generieke Fundamentals — vult FCF/P.E/Piotroski/PEG voor nieuwe selecties — dagelijks"

on:
  workflow_dispatch:

concurrency:
  group: workflow-run_generieke_fundamentals-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  bouw-generieke-fundamentals:
    concurrency:
      group: "refactor-yahoo-features"
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests psycopg2-binary
      - name: Run bouw_generieke_fundamentals
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_TICKERS_PER_RUN: "200"
          RECENTE_DAGEN_LIMIET: "5"
        run: python -m maintenance.retired_feature_builder build
