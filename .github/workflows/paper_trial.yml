name: Paperproef 10d - vaste virtuele portefeuille
on:
  push:
    branches: [main]
    paths: ['analyses/paper_trial.py', '.github/workflows/paper_trial.yml', 'requirements-paper.txt']
  schedule:
    - cron: '30 1 * * *'
  workflow_run:
    workflows: ['A A Parameter-model']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-trial-10d
  cancel-in-progress: false
  queue: max
jobs:
  paper:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: refactor-yahoo-features
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-paper.txt
      - name: Leg beslissing vast en volg virtuele portefeuilles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m analyses.paper_trial
