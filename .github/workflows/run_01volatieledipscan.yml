name: "Bot 01: FULL scanner (041-059) Volatiele Dip-Scan — hoge-ATR mean reversion (a-lijsten) — wekelijks"

on:
  schedule:
    - cron: "10 23 * * 5"
  workflow_dispatch:

concurrency:
  queue: max
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot-01volhunter:
    concurrency:
      group: "refactor-yahoo-full"
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install yfinance pandas numpy requests python-dotenv psycopg2-binary scikit-learn
      - name: Controleer Yahoo-repair dependency
        run: python -c "from sklearn.cluster import DBSCAN"
      - name: Run bot_01volhunter
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          MIN_ATR_PCT: "6.0"
          MAX_ATR_PCT: "60.0"
          IBS_MAX: "0.25"
          RSI_MAX: "15.0"
          VEREIST_UPTREND: "1"
          TOP_N: "3"
          BATCH_SIZE: "50"
          BATCH_PAUSE_SEC: "5"
        run: python bot_01volhunter.py live
