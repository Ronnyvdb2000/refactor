name: "TradingAgents Bridge — LLM-analyse op VCP of a_par_model picks"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Bron van de picks"
        required: false
        default: "par"
        type: choice
        options:
          - par
          - vcp
      horizon:
        description: "Horizon voor par-picks (alleen bij source=par)"
        required: false
        default: "10d"
        type: choice
        options:
          - 5d
          - 10d
          - 20d
          - 30d
          - 60d
      top_n:
        description: "Max aantal picks om te analyseren"
        required: false
        default: "5"
        type: string
      channel:
        description: "Waar het resultaat naartoe"
        required: false
        default: "telegram"
        type: choice
        options:
          - telegram
          - email
          - both
      trade_date:
        description: "Handelsdatum YYYY-MM-DD (leeg = vandaag)"
        required: false
        default: ""
        type: string
      groq_model:
        description: "Groq-model voor de analyse"
        required: false
        default: "openai/gpt-oss-20b"
        type: choice
        options:
          - openai/gpt-oss-20b
          - openai/gpt-oss-120b
          - qwen/qwen3.8-27b

  schedule:
    # Dagelijks om 23:00 UTC (na de daily run van a_par_model om 05:00)
    - cron: "0 23 * * *"

  push:
    paths:
      - "tradingagents_bridge.py"
      - "requirements-tradingagents.txt"
      - ".github/workflows/tradingagentsbridge.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: workflow-tradingagentsbridge-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE: ${{ inputs.source || 'par' }}
      HORIZON: ${{ inputs.horizon || '10d' }}
      TOP_N: ${{ inputs.top_n || '5' }}
      CHANNEL: ${{ inputs.channel || 'telegram' }}
      DATE_ARG: ${{ inputs.trade_date || '' }}
      GROQ_MODEL: ${{ inputs.groq_model || 'openai/gpt-oss-20b' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-tradingagents.txt

      - name: Valideer invoer
        run: |
          python - <<'PYTHON'
          import datetime, os
          assert os.environ['SOURCE'] in ('par', 'vcp'), 'Ongeldige bron'
          assert os.environ['HORIZON'] in ('5d','10d','20d','30d','60d'), 'Ongeldige horizon'
          assert os.environ['CHANNEL'] in ('telegram','email','both'), 'Ongeldig kanaal'
          assert 1 <= int(os.environ['TOP_N']) <= 10, 'top_n moet tussen 1 en 10 liggen'
          if os.environ['DATE_ARG']:
              datum = datetime.date.fromisoformat(os.environ['DATE_ARG'])
              assert datum.isoformat() == os.environ['DATE_ARG'], 'Gebruik YYYY-MM-DD'
              assert datum <= datetime.date.today(), 'Datum ligt in de toekomst'
          PYTHON

      - name: Install dependencies
        run: python -m pip install -r requirements-tradingagents.txt

      - name: Verify installaties
        run: |
          python -c "import tradingagents; print('tradingagents OK')"
          python -c "from tradingagents.graph.trading_graph import TradingAgentsGraph; print('TradingAgentsGraph OK')"
          python -c "import requests; print('requests OK')"

      - name: Check secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "FOUT: GROQ_API_KEY secret ontbreekt (verplicht voor TradingAgents)"
            exit 1
          fi
          if [ "$SOURCE" = "par" ] && [ -z "$SUPABASE_DB_URL" ]; then
            echo "FOUT: SUPABASE_DB_URL secret ontbreekt"
            exit 1
          fi
          echo "Vereiste secrets aanwezig."

      - name: Run a_par_model (indien source=par)
        if: env.SOURCE == 'par'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          echo "a_par_model draaien (zonder Telegram, alleen CSV-output)..."
          mkdir -p results
          
          DATE_ARGS=()
          if [ -n "$DATE_ARG" ]; then DATE_ARGS=(--datum "$DATE_ARG"); fi

          python a_par_model.py \
            --horizons "$HORIZON" \
            --top-n "$TOP_N" \
            "${DATE_ARGS[@]}" \
            --geen-db-write \
            --geen-notify \
            2>&1 | tee a_par_model_run.log

      - name: Haal VCP-signalen uit de laatste geslaagde bronrun
        if: env.SOURCE == 'vcp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow run_00vcp.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Geen geslaagde VCP-bronrun beschikbaar."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name vcp-signals --dir .
          test -s vcp_signals.json

      - name: Controleer par-picks
        if: env.SOURCE == 'par'
        run: |
          PAD="results/a_par_model_${HORIZON}_picks.csv"
          if [ ! -s "$PAD" ]; then
            echo "::error::$PAD ontbreekt; TradingAgents kan geen par-picks analyseren."
            exit 1
          fi

      - name: Run TradingAgents bridge
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          set -o pipefail

          ARGS=(--source "$SOURCE" --horizon "$HORIZON" --top-n "$TOP_N" --channel "$CHANNEL")
          if [ -n "$DATE_ARG" ]; then ARGS+=(--date "$DATE_ARG"); fi

          echo "============================================================"
          echo "TradingAgents bridge start"
          echo "  source  = $SOURCE"
          echo "  horizon = $HORIZON"
          echo "  top_n   = $TOP_N"
          echo "  channel = $CHANNEL"
          echo "  model   = $GROQ_MODEL"
          printf "  args    = %q " "${ARGS[@]}"
          echo
          echo "============================================================"

          python -u tradingagents_bridge.py "${ARGS[@]}" 2>&1 | tee tradingagents_output.log

      - name: Bewaar log + picks als artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tradingagents-output-${{ github.run_number }}
          path: |
            tradingagents_output.log
            a_par_model_run.log
            results/a_par_model_*_picks.csv
            vcp_signals.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Samenvatting in GitHub Actions
        if: always()
        run: |
          if [ -f tradingagents_output.log ]; then
            echo "## TradingAgents resultaat" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 50 tradingagents_output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
