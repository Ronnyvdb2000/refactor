name: "Bot 01: FULL scanner (041-059) quality scanner (x-lijsten) GARP onderwaardering (Hoogland) — dagelijks"

on:
  schedule:
    - cron: "55 19 * * 1-5"
  workflow_dispatch:

concurrency:
  queue: max
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot-01hoogl:
    concurrency:
      group: "refactor-yahoo-daily"
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests python-dotenv psycopg2-binary
      - name: Run bot_01hoogl
        env:
          PYTHONUNBUFFERED: "1"
          # TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
        run: python -m strats.bot_01hoogl live
