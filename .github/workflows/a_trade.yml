name: A trade - Beste Signaal

on:
  schedule:
    # Elke dag om 19:15 UTC; afronding van andere workflows apart controleren.
    - cron: '15 19 * * *'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  beste-signaal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: pip install psycopg2-binary requests pandas numpy yfinance

      - name: Controleer module-import
        run: python -c "import importlib; importlib.import_module('combiners.a_trade')"

      - name: Draai combiners.a_trade
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          LOOKBACK_DAYS: '3'
          BESCHIKBAAR_KAPITAAL: '2500'
          TRANSACTIE_BEDRAG: '2500'
          AANTAL_PICKS: '5'
        run: python -m combiners.a_trade
