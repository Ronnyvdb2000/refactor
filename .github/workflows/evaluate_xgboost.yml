name: XGBoost V3 — evaluatie na publicatie
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xgboost-evaluation-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: refactor-yahoo-features
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Evalueer vastgelegde V3-voorspellingen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: python -m analyses.evaluate_xgboost --telegram
      - name: Bewaar evaluatie en dekking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-evaluation-${{ github.run_id }}
          overwrite: true
          path: |
            results/xgboost_evaluation.json
            results/xgboost_evaluation.md
          if-no-files-found: warn
          retention-days: 90

