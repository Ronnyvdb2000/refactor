name: Research principles checks
on:
  push:
    branches: [feature/quantify-principles]
    paths: ['research/**', 'config/research.json', 'tests/test_research.py', 'combiners/a_trade_combi.py', '.github/workflows/research_checks.yml']
  pull_request:
    paths: ['research/**', 'config/research.json', 'tests/test_research.py', 'combiners/a_trade_combi.py', '.github/workflows/research_checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python -m pytest tests/test_research.py -q
