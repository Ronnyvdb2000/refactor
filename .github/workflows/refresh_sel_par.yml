name: sel_par - dagelijkse onderzoekstabel

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Dezelfde selectiedag opnieuw verversen'
        type: boolean
        default: false
      source_wait_minutes:
        description: 'Maximale wachttijd op bronruns; 0 voor gecontroleerd herstel'
        type: number
        default: 120

permissions:
  contents: read
  actions: read

concurrency:
  group: sel-par-refresh-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FEATURE_BUILD_MANIFEST: results/feature_build.json
    concurrency:
      group: refactor-yahoo-features
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements-analysis.txt PyYAML==6.0.3
      - name: Selecties overzetten, kenmerken aanvullen en koersen opvolgen
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE_WAIT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.source_wait_minutes) || '120' }}
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          export REFRESH_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          args=(--wait-minutes "$SOURCE_WAIT")
          if [ "$FORCE_REFRESH" = "true" ]; then args+=(--force); fi
          python -m maintenance.refresh_sel_par "${args[@]}"
      - name: Bewaar verversingsrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sel-par-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/sel_par_refresh.json
          if-no-files-found: warn
      - name: Publiceer bevestigde sel_par-invoer voor scoring
        uses: actions/upload-artifact@v4
        with:
          name: feature-build-manifest
          path: results/feature_build.json
          if-no-files-found: error
