name: sel_par - dagelijkse onderzoekstabel

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Dezelfde selectiedag opnieuw verversen'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sel-par-refresh-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install psycopg2-binary==2.9.10 PyYAML==6.0.3
      - name: Controleer nachtelijke bronnen en ververs sel_par
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          export REFRESH_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          args=()
          if [ "$FORCE_REFRESH" = "true" ]; then args+=(--force); fi
          python -m maintenance.refresh_sel_par "${args[@]}"
      - name: Bewaar verversingsrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sel-par-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/sel_par_refresh.json
          if-no-files-found: warn
