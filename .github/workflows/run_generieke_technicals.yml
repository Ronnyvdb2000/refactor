name: "Feature Store: Generieke Technicals (ATR/RSI/MA/volume, strategie-onafhankelijk) — dagelijks"

on:
  schedule:
    # Dagelijks 21:00 UTC; daadwerkelijke start kan wachten op de Yahoo-featuregroep.
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: workflow-run_generieke_technicals-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  bouw-generieke-technicals:
    concurrency:
      group: "refactor-yahoo-features"
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install yfinance pandas numpy requests python-dotenv psycopg2-binary

      - name: Run bouw_generieke_technicals
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bouw_generieke_technicals.py

      - name: Bewaar dekkingsdiagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generieke-technicals-dekking
          path: results/generieke_technicals_dekking.csv
          if-no-files-found: warn
