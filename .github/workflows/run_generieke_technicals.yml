name: "Feature Store: Generieke Technicals (ATR/RSI/MA/volume, strategie-onafhankelijk) — dagelijks"

on:
  workflow_dispatch:

concurrency:
  group: workflow-run_generieke_technicals-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  bouw-generieke-technicals:
    concurrency:
      group: "refactor-yahoo-features"
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install yfinance pandas numpy requests python-dotenv psycopg2-binary scikit-learn

      - name: Controleer Yahoo-repair dependency
        run: python -c "from sklearn.cluster import DBSCAN"

      - name: Freeze selection cutoff before building features
        run: |
          python - <<'PYCODE'
          import os
          from common.feature_pipeline import latest_closed_feature_day
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"FEATURE_SELECTION_CUTOFF={latest_closed_feature_day().isoformat()}\n")
          PYCODE

      - name: Run bouw_generieke_technicals
        env:
          PYTHONUNBUFFERED: "1"
          BACKFILL_DATUM: ${{ env.FEATURE_SELECTION_CUTOFF }}
          FEATURE_SELECTION_CUTOFF: ${{ env.FEATURE_SELECTION_CUTOFF }}
          FEATURE_BUILD_MANIFEST: results/feature_build.json
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m maintenance.retired_feature_builder

      - name: Bewaar dekkingsdiagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generieke-technicals-dekking
          overwrite: true
          path: results/generieke_technicals_dekking.csv
          if-no-files-found: warn

      - name: Publish successful feature build manifest
        uses: actions/upload-artifact@v4
        with:
          name: feature-build-manifest
          overwrite: true
          path: results/feature_build.json
          if-no-files-found: error
          retention-days: 7
