name: Test Telegram

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Welke test draaien?'
        required: true
        default: 'test_telegram'
        type: choice
        options:
          - test_telegram
          - test_verbinding
          - beide

permissions:
  contents: read

concurrency:
  group: workflow-test_telegram-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install requests python-dotenv

      - name: Check secrets
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_TOKEN en/of TELEGRAM_CHAT_ID ontbreekt in de repo-secrets"
            exit 1
          fi

      - name: Telegram-bot controleren
        if: ${{ inputs.test == 'test_telegram' || inputs.test == 'beide' }}
        run: |
          python -m maintenance.check_telegram --message bot

      - name: Telegram-verbinding controleren
        if: ${{ !cancelled() && (inputs.test == 'test_verbinding' || inputs.test == 'beide') }}
        run: |
          python -m maintenance.check_telegram --message verbinding
