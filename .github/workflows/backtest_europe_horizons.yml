name: Backtest Europa - overige horizons en ML
on:
  push:
    branches: [main]
    paths: ['.github/workflows/backtest_europe_horizons.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matched-historical-ml-backtest
  cancel-in-progress: false
  queue: max
jobs:
  comparison:
    name: Europa ${{ matrix.horizon }} handelsdagen
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        horizon: [5, 20, 30, 60]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: refactor-yahoo-features
      cancel-in-progress: false
      queue: max
    env:
      BACKTEST_HORIZON: ${{ matrix.horizon }}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-paper.txt -r requirements-europe-ml.txt
      - name: Bouw Europese parameterbron voor deze horizon
        id: parameter
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m analyses.backtest_europe
      - name: Meld parameterbron via Telegram
        if: ${{ !cancelled() && (steps.parameter.outcome == 'success' || steps.parameter.outcome == 'failure') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m analyses.backtest_europe_telegram
      - name: Vergelijk alle modellen op exact deze Europese bron
        id: ml
        if: ${{ !cancelled() && steps.parameter.outcome == 'success' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EUROPE_SOURCE_RUN_KEY: a_par_europe_${{ matrix.horizon }}d:${{ github.run_id }}
        run: python -m analyses.backtest_europe_ml
      - name: Meld gezamenlijke modelvergelijking via Telegram
        if: ${{ !cancelled() && (steps.ml.outcome == 'success' || steps.ml.outcome == 'failure') }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m analyses.backtest_europe_ml_telegram
