name: Verwijder CSV Bestanden

on:
#  schedule:
#    - cron: '0 23 * * *'
  workflow_dispatch:

# CROCIALE TOEVOEGING: Geef de runner expliciet schrijfrechten om de repo aan te passen
permissions:
  contents: write

concurrency:
  group: workflow-verwijdercsv-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  clean-repo:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Verwijder CSV bestanden
      run: |
        echo "Zoeken naar CSV bestanden..."
        find . -name "*.csv" -type f -delete
        
    - name: Commit en Push wijzigingen
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add -A
        
        if git diff-index --quiet HEAD --; then
          echo "Geen CSV bestanden gevonden om te verwijderen."
        else
          git commit -m "Automated: CSV bestanden opgeschoond door bot"
          # VERANDERD VAN master NAAR main:
          python -m maintainance.push_generated_commit
        fi
