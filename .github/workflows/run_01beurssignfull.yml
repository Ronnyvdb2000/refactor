name: "Bot 01: BeursSignalen-methodiek nagebouwd (a-lijsten, VOLLEDIG universum) — wekelijks"

on:
  schedule:
    - cron: "40 22 * * 5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot-01beurssig-full:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install yfinance pandas numpy requests python-dotenv psycopg2-binary scikit-learn
      - name: Controleer Yahoo-repair dependency
        run: python -c "from sklearn.cluster import DBSCAN"
      - name: Run bot_01beurssig (full scan)
        env:
          PYTHONUNBUFFERED: "1"
          # Telegram bewust uit (token ongeldig). Weer aanzetten: de # weghalen
          # TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
        run: python bot_01beurssign.py full
