name: Research mandjes - opvolging naar Telegram
on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-evaluation-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: refactor-yahoo-features
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install pandas yfinance psycopg2-binary
      - name: Evalueer opgeslagen mandjes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: python -m research.evaluate --telegram
      - name: Bewaar evaluatie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/research_evaluation.json
            results/research_evaluation.md
          if-no-files-found: warn
          retention-days: 90
      - name: Meld onvolledige uitvoering
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from research.telegram import send_text; send_text('Opvolging onderzoeksmandjes ONVOLLEDIG. Controleer de Actions-log; geen resultaten als geslaagd beschouwen.')"
