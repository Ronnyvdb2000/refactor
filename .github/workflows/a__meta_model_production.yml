name: A A Meta-model train + score

on:
  workflow_run:
    workflows: ["Feature Store: Generieke Technicals (ATR/RSI/MA/volume, strategie-onafhankelijk) — dagelijks"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 22 * * 0"     # zondag: alleen hertrainen; scoring volgt de featurebouw
  workflow_dispatch:
    inputs:
      retrain:
        description: "Model opnieuw trainen? (true = ja, false = alleen scoren)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

concurrency:
  queue: max
  group: meta-model-production
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    env:
      FEATURE_BUILD_MANIFEST: ${{ github.event_name == 'workflow_run' && 'feature-build/feature_build.json' || '' }}
      FEATURE_BUILD_REQUIRED: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
      FEATURE_EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
      FEATURE_EXPECTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      FEATURE_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-analysis.txt

      - name: Download manifest from the successful feature run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: feature-build-manifest
          path: feature-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate feature build provenance
        run: |
          python -c "from common.feature_pipeline import load_feature_context, context_summary; c = load_feature_context(); print(context_summary(c) if c else 'Handmatige run: bestaande strikte invoercontrole blijft actief')"

      - name: Trainen (retrain=true of zondag-schedule)
        # OUDE CODE (alleen handmatig), bewust bewaard als documentatie:
        # if: github.event.inputs.retrain == 'true'
        if: github.event.inputs.retrain == 'true' || github.event.schedule == '0 22 * * 0'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python -m meta_models.a_meta_model_train --alpha 1.0 --notities "auto-train" \
            2>&1 | tee meta_model_train.log

      - name: Scoren
        if: github.event_name != 'schedule'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python -m meta_models.a_meta_model_score 2>&1 | tee meta_model_score.log

      - name: Logs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-model-production-${{ github.run_number }}
          path: |
            meta_model_train.log
            meta_model_score.log
          if-no-files-found: ignore
          retention-days: 30
