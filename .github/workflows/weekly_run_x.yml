name: Weekly Report X

on:
  schedule:
    - cron: '15 23 * * 5'   # Vrijdag 23:15 UTC; gedeelde concurrency voor JSON-commits
  workflow_dispatch:

concurrency:
  group: weekly-json-main
  cancel-in-progress: false

jobs:
  report-x:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      WEEKLY_CHECKPOINT_DIR: .weekly-cache
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance pandas numpy requests python-dotenv
      - name: Verify weekly import
        run: python -c "import weekly.weekly_report_x"
      - name: Bepaal cacheweek
        id: cacheweek
        run: python -c "import os; from weekly.shared import weekgrenzen; print('vrijdag='+str(weekgrenzen()[1]), file=open(os.environ['GITHUB_OUTPUT'], 'a'))"
      - name: Herstel bewaarde weekkoersen
        id: herstel
        uses: actions/cache/restore@v4
        with:
          path: .weekly-cache
          key: ${{ runner.os }}-weekly-x-v1-${{ steps.cacheweek.outputs.vrijdag }}-${{ hashFiles('weekly/*.py', 'weekly/symbols.csv', 'tickers*.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Koersbestanden valideren ticker en periode zelf; gewijzigde aliassen
          # mogen de bruikbare reeksen van dezelfde week hergebruiken.
          restore-keys: |
            ${{ runner.os }}-weekly-x-v1-${{ steps.cacheweek.outputs.vrijdag }}-${{ hashFiles('weekly/*.py', 'weekly/symbols.csv', 'tickers*.txt') }}-
            ${{ runner.os }}-weekly-x-v1-${{ steps.cacheweek.outputs.vrijdag }}-
      - name: Run Report X
        timeout-minutes: 75
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m weekly.weekly_report_x
      - name: Opslaan laatste_toppers_x.json
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f laatste_toppers_x.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen gevonden."
          else
            git commit -m "Weekly toppers X update $(date +%Y-%m-%d)"
            for poging in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
      - name: Bewaar voortgang ook bij providerstop
        if: always() && steps.herstel.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .weekly-cache
          key: ${{ steps.herstel.outputs.cache-primary-key }}
      - name: Bewaar weekrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-rapport-${{ github.run_id }}
          path: |
            weekly_rapport_*.txt
            weekly_dekking_*.csv
          if-no-files-found: warn
