name: Diag koersen
on:
  workflow_dispatch:
concurrency:
  group: workflow-diag_koersen-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  diag:
    concurrency:
      group: "refactor-yahoo-features"
      queue: max
      cancel-in-progress: false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python -m maintenance.diag_koersen MOL.WA AAPL
