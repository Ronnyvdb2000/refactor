name: Diag koersen
on:
  workflow_dispatch:
concurrency:
  group: workflow-diag_koersen-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  diag:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python diag_koersen.py MOL.WA AAPL
