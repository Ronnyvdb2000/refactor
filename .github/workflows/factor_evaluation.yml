name: OOS-factoranalyse - vaste scores en opgeslagen koersen
on:
  push:
    branches: [main]
    paths: ['analyses/factor_evaluation.py', '.github/workflows/factor_evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factor-evaluation
  queue: max
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-analysis.txt
      - name: Analyseer uitsluitend bevroren gegevens
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python -m analyses.factor_evaluation --latest-research
          cat results/factor_evaluation/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: oos-factor-evaluation
          path: results/factor_evaluation/
          if-no-files-found: error
          retention-days: 90
