name: "A trade volatiel: Q score x volatiliteit"

on:
  schedule:
    - cron: "0 5 * * *"   # Dagelijks 05:00 UTC
  workflow_dispatch:

concurrency:
  queue: max
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  bot-combi-volatiel:
    concurrency:
      group: "refactor-yahoo-daily"
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy scipy requests python-dotenv psycopg2-binary
      - name: Controleer module-import
        run: python -c "import importlib; importlib.import_module('combiners.a_trade_combi')"

      - name: Run combiners.a_trade_combi
        env:
        #  TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
        #  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
          MIN_ATR_PCT: "4.0"
          MAX_ATR_PCT: "25.0"
          TOP_N: "10"
        run: python -m combiners.a_trade_combi
