name: Weekly Report Opvolg

on:
  schedule:
    - cron: '0 23 * * 5'   # Vrijdag 23:00 UTC; eigen database-export
  workflow_dispatch:

concurrency:
  group: weekly-opvolg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report-opvolg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance pandas numpy requests python-dotenv psycopg2-binary
      - name: Verify weekly import
        run: python -c "import weekly.weekly_report_opvolg"
      - name: Run Opvolg-analyse
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m weekly.weekly_report_opvolg
      - name: Bewaar scan-dekking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-opvolg-dekking-${{ github.run_id }}
          path: weekly_dekking_opvolg.csv
          if-no-files-found: warn
