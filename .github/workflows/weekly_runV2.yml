name: Weekly Report backtest

on:
  workflow_run:
    workflows: ["Weekly Report"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-backtest
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install yfinance pandas numpy requests python-dotenv
      - name: Verify weekly import
        run: python -c "import weekly.weekly_rep_backtest"
      - name: Run Backtest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m weekly.weekly_rep_backtest
