name: "Bot 01: FULL scanner (041-059) Pairs trading"

on:
  schedule:
    # Weekdagen 19:50 UTC — binnen het bestaande 19:30-20:10 UTC-venster van de andere bots
    - cron: '50 19 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modus: live of backtest'
        required: false
        default: 'live'
        type: choice
        options:
          - live
          - backtest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests statsmodels psycopg2-binary

      - name: Draai bot_01cointegr
        env:
          PYTHONUNBUFFERED: "1"
          # TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python bot_01cointegr.py ${{ github.event.inputs.mode || 'live' }}

      - name: Bewaar backtestuitvoer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cointegr-backtest
          path: backtest_results/*.csv
          if-no-files-found: ignore
          retention-days: 7
