name: XGBoost V3 gecontroleerd - handmatige proefrun

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proefrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Benodigde pakketten installeren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas==2.2.3" "scikit-learn==1.5.2" "xgboost==3.2.0" joblib psycopg2-binary requests

      - name: XGBoost V3 gecontroleerd uitvoeren
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python xgboostV3_gecontroleerd.py

      - name: Modelbestanden bewaren als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgboostV3-gecontroleerd-modellen
          path: |
            xgboostV3_10d_model.pkl
            xgboostV3_30d_model.pkl
            xgboostV3_60d_model.pkl
          if-no-files-found: warn
          retention-days: 14
