name: CatBoost V1 - handmatige kandidaat-evaluatie
on:
  workflow_dispatch:
    inputs:
      horizons:
        description: Horizons (komma-gescheiden 10d,30d,60d)
        default: '10d,30d,60d'
        required: true
      target:
        description: Trainingsdoel
        type: choice
        options: [excess, abs]
        default: excess
permissions:
  contents: read
concurrency:
  group: catboostV1-controle-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies installeren
        run: python -m pip install -r requirements-catboost.txt
      - name: CatBoost evalueren
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATBOOST_HORIZONS: ${{ inputs.horizons }}
          CATBOOST_TARGET: ${{ inputs.target }}
        run: python -m models.catboostV1 --horizons "$CATBOOST_HORIZONS" --target "$CATBOOST_TARGET" --telegram
      - name: Rapporten en toegelaten kandidaten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catboostV1-controle-${{ github.run_id }}-${{ github.run_attempt }}
          path: models/catboostV1_controle/
          if-no-files-found: warn
          retention-days: 30
