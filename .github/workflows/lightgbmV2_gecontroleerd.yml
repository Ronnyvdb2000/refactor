env:
  FEATURE_BUILD_MANIFEST: feature-build/feature_build.json
  FEATURE_BUILD_REQUIRED: '1'

name: LightGBM V2 gecontroleerd - handmatige proefrun

on:
  workflow_dispatch:

permissions:

  actions: read
  contents: read

concurrency:
  group: workflow-lightgbmv2_gecontroleerd-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  proefrun:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pakketten installeren
        run: |
          python -m pip install "numpy==1.26.4" "pandas==2.2.3" "scikit-learn==1.5.2" "lightgbm==4.6.0" joblib psycopg2-binary requests
      - name: Resolve trusted feature build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m maintenance.resolve_feature_manifest

      - name: LightGBM kandidaat evalueren
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m maintenance.run_ready models.xLightgbmV2_gecontroleerd
      - name: Rapport en kandidaten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightgbmV2-controle
          path: models/lightgbmV2_controle/
          if-no-files-found: warn
          retention-days: 14
