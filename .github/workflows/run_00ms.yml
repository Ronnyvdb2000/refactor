name: "Bot 00: FULL scanner (041-059) Minervini SEPA"

on:
  schedule:
    - cron: "50 19 * * 1-5"
  workflow_dispatch:

concurrency:
  group: workflow-run_00ms-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  bot-00ms:
    concurrency:
      group: "refactor-yahoo-daily"
      queue: max
      cancel-in-progress: false
    timeout-minutes: 300
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests python-dotenv psycopg2-binary
      - name: Run bot_00ms
        env:
          # Telegram uitgeschakeld; e-mail en database blijven actief.
          PYTHONUNBUFFERED: "1"
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER:   ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL:  ${{ secrets.SUPABASE_DB_URL }}
        run: python -m strats.bot_00ms live
