name: "Bot 00: FULL Scanner (041-059) MR ORB"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5"
    - cron: "30 15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: mr-orb-scan
  cancel-in-progress: false

jobs:
  bot-00mr-orb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installeer dependencies
        run: pip install yfinance pandas numpy requests python-dotenv psycopg2-binary
      - name: Run MR ORB
        env:
          PYTHONUNBUFFERED: "1"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python bot_00mr.py orb
      - name: Bewaar scanresultaten
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr-orb-signals
          path: |
            mr_orb_scan.json
            mr_orb_signalen_*.csv
          retention-days: 7
          if-no-files-found: warn
